# Limpeza pontual: apaga as duas versões "1.0.0-beta.1" duplicadas da Releases e a tag v1.0.0-beta.1.
# Roda uma vez, quando a tag limpeza/beta1 é enviada; depois este arquivo é retirado.
name: Limpeza de versões duplicadas

on:
  push:
    tags: ['limpeza/*']

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Apagar as versões 1.0.0-beta.1 e a tag
        run: |
          for id in 455863820 455863821; do
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name 2>/dev/null || echo "")
            if [ "$tag" = "v1.0.0-beta.1" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" && echo "versão $id apagada"; else echo "versão $id não é a 1.0.0-beta.1 ou já não existe: nada feito"; fi
          done
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.0.0-beta.1" && echo "tag v1.0.0-beta.1 apagada" || echo "tag v1.0.0-beta.1 já não existe"
      - name: Apagar a tag que disparou a limpeza
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME" || true
